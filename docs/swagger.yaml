info:
  contact: {}
paths:
  /api/v1/accounts:
    get:
      parameters:
      - description: only active accounts
        in: query
        name: active
        type: boolean
      - description: filter by account type
        in: query
        name: type
        type: string
      - description: filter by provider group
        in: query
        name: group
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_mauricioarielramirez_financial-tracking-app-backend_internal_usecase_account.AccountOutput'
            type: array
      summary: List accounts
      tags:
      - accounts
    post:
      consumes:
      - application/json
      parameters:
      - description: Account to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_mauricioarielramirez_financial-tracking-app-backend_internal_usecase_account.CreateAccountInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_mauricioarielramirez_financial-tracking-app-backend_internal_usecase_account.AccountOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
        "409":
          description: an account with that name already exists
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      summary: Create account
      tags:
      - accounts
  /api/v1/accounts/{id}:
    delete:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      summary: Deactivate account (soft delete)
      tags:
      - accounts
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mauricioarielramirez_financial-tracking-app-backend_internal_usecase_account.AccountOutput'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      summary: Get account by id
      tags:
      - accounts
    patch:
      consumes:
      - application/json
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Only the fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_mauricioarielramirez_financial-tracking-app-backend_internal_usecase_account.PatchAccountInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mauricioarielramirez_financial-tracking-app-backend_internal_usecase_account.AccountOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
        "409":
          description: an account with that name already exists
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      summary: Partially update account
      tags:
      - accounts
    put:
      consumes:
      - application/json
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Full account payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_mauricioarielramirez_financial-tracking-app-backend_internal_usecase_account.UpdateAccountInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mauricioarielramirez_financial-tracking-app-backend_internal_usecase_account.AccountOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
        "409":
          description: an account with that name already exists
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      summary: Replace account (full update)
      tags:
      - accounts
  /api/v1/quotes/suggested:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mauricioarielramirez_financial-tracking-app-backend_internal_usecase_quote.SuggestedOutput'
      summary: Suggested exchange rates
      tags:
      - quotes
  /api/v1/snapshots:
    get:
      parameters:
      - description: RFC3339 date, inclusive lower bound
        in: query
        name: from
        type: string
      - description: RFC3339 date, inclusive upper bound
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_mauricioarielramirez_financial-tracking-app-backend_internal_usecase_snapshot.SnapshotSummary'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      summary: List snapshots
      tags:
      - snapshots
    post:
      consumes:
      - application/json
      parameters:
      - description: Snapshot to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_mauricioarielramirez_financial-tracking-app-backend_internal_usecase_snapshot.CreateSnapshotInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_mauricioarielramirez_financial-tracking-app-backend_internal_usecase_snapshot.SnapshotOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
        "409":
          description: a snapshot already exists for that month (use force to override,
            RF-08)
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      summary: Create monthly snapshot
      tags:
      - snapshots
  /api/v1/snapshots/{id}:
    delete:
      parameters:
      - description: Snapshot ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      summary: Delete snapshot
      tags:
      - snapshots
    get:
      parameters:
      - description: Snapshot ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mauricioarielramirez_financial-tracking-app-backend_internal_usecase_snapshot.SnapshotOutput'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      summary: Get snapshot by id
      tags:
      - snapshots
    put:
      consumes:
      - application/json
      parameters:
      - description: Snapshot ID
        in: path
        name: id
        required: true
        type: string
      - description: Full snapshot payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_mauricioarielramirez_financial-tracking-app-backend_internal_usecase_snapshot.UpdateSnapshotInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mauricioarielramirez_financial-tracking-app-backend_internal_usecase_snapshot.SnapshotOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
        "409":
          description: a snapshot already exists for the new month (use force, RF-08)
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      summary: Replace snapshot (full update)
      tags:
      - snapshots
  /api/v1/snapshots/import:
    post:
      consumes:
      - application/json
      parameters:
      - description: Snapshots to import
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_mauricioarielramirez_financial-tracking-app-backend_internal_usecase_snapshot.ImportInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mauricioarielramirez_financial-tracking-app-backend_internal_usecase_snapshot.ImportOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      summary: Bulk import historical snapshots
      tags:
      - snapshots
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
swagger: "2.0"
