services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
      DB_DRIVER: sqlite3
      DB_DSN: /data/finance.db
      MIGRATIONS_PATH: ./migrations
      API_KEY: ""
      DOLARAPI_BASE_URL: https://dolarapi.com/v1
      DOLAR_TIPO: oficial
      DOLAR_CAMPO: venta
      COINGECKO_BASE_URL: https://api.coingecko.com/api/v3
      EXTERNAL_API_TIMEOUT_SECONDS: "5"
    volumes:
      - finance-db:/data

volumes:
  finance-db:
